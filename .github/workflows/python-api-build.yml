name: Python API build
on:
  push:
    branches: [master, 'codex/**']
  pull_request:
    paths: ['ai-job-api/**', 'docker-compose.local.yml', '*-job-helper.ps1', '.github/workflows/python-api-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      API_TEST_DATABASE_URL: mysql+asyncmy://root:ci-root-only@127.0.0.1:3306/ai_job_api_ci?charset=utf8mb4
      API_TEST_ALLOW_SCHEMA_SETUP: 'true'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: ai_job_api_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-only --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.23'
          python-version: '3.12'
      - run: uv sync --frozen
        working-directory: ai-job-api
      - run: uv run pytest
        working-directory: ai-job-api
      - run: uv run ruff check src tests
        working-directory: ai-job-api
      - run: uv run ruff format --check src tests
        working-directory: ai-job-api
      - run: docker build -t job-helper-python-api:ci ai-job-api
