name: Local runtime maintenance

on:
  push:
    branches:
      - master
      - 'codex/**'
  pull_request:
    paths:
      - '.env.example'
      - '.github/workflows/local-runtime-maintenance.yml'
      - 'ai-job-api/**'
      - 'ai-job-hunting-ui/public/healthz'
      - 'docker-compose.local.yml'
      - '*-job-helper.ps1'
      - 'job-helper-release-common.psm1'
      - 'tests/*.tests.ps1'
      - '本机部署说明.md'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell maintenance scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -LiteralPath . -Filter '*-job-helper.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error ("{0}: {1}" -f $_.Extent.File, $_.Message) }
            }
          }
          if ($failed) { exit 1 }
      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.example -f docker-compose.local.yml config --quiet
      - name: Verify API and Agent outcome runtime wiring
        shell: pwsh
        run: ./tests/outcome-runtime.tests.ps1
      - name: Validate frontend health asset
        shell: pwsh
        run: |
          if ((Get-Content -Raw ai-job-hunting-ui/public/healthz).Trim() -ne 'ok') {
            throw 'Frontend health asset must contain exactly ok.'
          }
      - name: Test release receipt and tag behavior
        shell: pwsh
        run: .\tests\job-helper-maintenance.tests.ps1

  validate-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse maintenance scripts on Windows PowerShell
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -LiteralPath . -Filter '*-job-helper.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error ("{0}: {1}" -f $_.Extent.File, $_.Message) }
            }
          }
          if ($failed) { exit 1 }
      - name: Verify command responsibility boundaries
        shell: powershell
        run: |
          $start = Get-Content -Raw start-job-helper.ps1
          $build = Get-Content -Raw build-job-helper.ps1
          $release = Get-Content -Raw release-job-helper.ps1
          if ($start -match 'docker compose|pnpm|mvn|sync-local-runtime|alembic') {
            throw 'Daily start may only start existing containers, never rebuild/recreate/migrate.'
          }
          if ($build -match 'compose[^\r\n]+(?:\bup\b|\brun\b)|docker start') {
            throw 'Build contains a service startup command.'
          }
          if ($release -match 'Assert-PushedRequiredWorkflows|EmergencyPreview') {
            throw 'Normal local release must support local-first validation.'
          }
      - name: Test release receipt and tag behavior
        shell: powershell
        run: .\tests\job-helper-maintenance.tests.ps1
