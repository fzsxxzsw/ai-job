server.port=9100
spring.application.name=ai-job
spring.ai.retry.max-attempts=1
spring.main.allow-circular-references=true

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

spring.datasource.url=jdbc:mysql://mysql:3306/ai_job?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=ai_job
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driverClassName=com.mysql.jdbc.Driver

# PDF resumes are parsed locally; this placeholder only satisfies the legacy Kimi bean.
spring.ai.kimi.api-key=${KIMI_API_KEY:local-pdf-parser}
spring.ai.kimi.base-url=https://api.moonshot.cn/
spring.ai.kimi.chat.options.model=moonshot-v1-8k
spring.ai.openai.api-key=local-placeholder

openai.pool.config.auto=false
openai.pool.config.list=[{"base-url":"${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}","api-key":"${AI_API_KEY:}","name":"openai-pool","completions-path":"${AI_COMPLETIONS_PATH:/chat/completions}","chat.options.model":"${AI_MODEL:qwen3-vl-32b-thinking}","extraBody":{"enable_thinking":true,"thinking_budget":256}}]

smart.username=admin
smart.password=${SMART_PASSWORD}

alipay.app_id=
alipay.merchant_private_key=
alipay.alipay_public_key=
alipay.notify_url=
alipay.charset=utf-8
alipay.gatewayUrl=
alipay.logo.base64=

login-Filter.freeLoginArray=["/api/user/import/resume","/api/user/silently/login","/api/pay/paySuccessCallBack","/api/pay/getQr","/actuator/health","/test/**"]

# Personal localhost deployment: do not require commercial product purchases.
product.permission.enabled=false
admin.userId.list=[1]

# Local single-user performance defaults. Override with environment variables when needed.
spring.datasource.druid.initial-size=2
spring.datasource.druid.min-idle=2
spring.datasource.druid.max-active=10
spring.datasource.druid.max-wait=5000
spring.datasource.druid.validation-query=SELECT 1
spring.datasource.druid.test-while-idle=true
server.tomcat.threads.max=80
server.tomcat.threads.min-spare=4
server.compression.enabled=true
server.compression.min-response-size=1KB
spring.lifecycle.timeout-per-shutdown-phase=20s
server.shutdown=graceful
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

logging.file.name=/app/logs/ai-job.log
# Bound local diagnostic retention so long-running deployments cannot fill the Docker volume.
logging.logback.rollingpolicy.file-name-pattern=/app/logs/ai-job.%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=20MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=512MB
server.tomcat.accesslog.enabled=true
server.tomcat.basedir=/app/logs
server.tomcat.accesslog.directory=tomcat_access_log
