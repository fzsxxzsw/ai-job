name: job-helper

services:
  frontend:
    image: ${JOB_HELPER_FRONTEND_IMAGE:-nginx:1.27-alpine}
    container_name: job-helper-frontend
    restart: unless-stopped
    volumes:
      - ./ai-job-hunting-ui/public:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:5173:80"
    healthcheck:
      test: ["CMD-SHELL", "tmp=$$(mktemp) || exit 1; trap 'rm -f \"$$tmp\"' EXIT; wget -qO \"$$tmp\" http://127.0.0.1/healthz || exit 1; hex=$$(od -An -tx1 \"$$tmp\" | tr -d ' \\n'); case \"$$hex\" in 6f6b|6f6b0a|6f6b0d0a) exit 0 ;; *) exit 1 ;; esac"]
      interval: 15s
      timeout: 3s
      retries: 6
    networks:
      - job-helper

  mysql:
    image: ${JOB_HELPER_MYSQL_IMAGE:-mysql:8.0}
    container_name: job-helper-mysql
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ai_job
      MYSQL_USER: ai_job
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./ai-job-api/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - job-helper

  backend:
    image: ${JOB_HELPER_BACKEND_IMAGE:-job-helper-backend:release}
    container_name: job-helper-backend
    restart: unless-stopped
    build:
      context: ./ai-job-api
      dockerfile: Dockerfile
      labels:
        org.opencontainers.image.revision: ${JOB_HELPER_BUILD_SHA:-unreleased}
        io.job-helper.build-id: ${JOB_HELPER_BUILD_ID:-unreleased}
        io.job-helper.build-channel: ${JOB_HELPER_BUILD_CHANNEL:-unreleased}
        io.job-helper.managed: "true"
        io.job-helper.version: ${JOB_HELPER_VERSION:-unreleased}
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JOB_HELPER_PERSONAL_MODE: ${JOB_HELPER_PERSONAL_MODE:-true}
      API_OWNER_USER_ID: ${API_OWNER_USER_ID:-0}
      API_READ_ONLY: "false"
      API_SECRET_FILE: /app/data/session.key
      JOB_HELPER_BUILD_ID: ${JOB_HELPER_BUILD_ID:-unreleased}
      JOB_HELPER_VERSION: ${JOB_HELPER_VERSION:-unreleased}
      API_ALLOWED_MODEL_HOSTS: ${API_ALLOWED_MODEL_HOSTS:-}
      API_CONFIRMED_EDUCATION: ${API_CONFIRMED_EDUCATION:-}
      API_MAIL_ENABLED: ${API_MAIL_ENABLED:-false}
      API_MAIL_HOST: ${API_MAIL_HOST:-}
      API_MAIL_PORT: ${API_MAIL_PORT:-465}
      API_MAIL_USERNAME: ${API_MAIL_USERNAME:-}
      API_MAIL_PASSWORD: ${API_MAIL_PASSWORD:-}
      API_MAIL_SENDER: ${API_MAIL_SENDER:-}
      API_MAIL_SECURITY: ${API_MAIL_SECURITY:-ssl}
      API_MAIL_TIMEOUT_SECONDS: ${API_MAIL_TIMEOUT_SECONDS:-10}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      AI_COMPLETIONS_PATH: ${AI_COMPLETIONS_PATH:-/chat/completions}
      AI_MODEL: ${AI_MODEL:-qwen3-vl-32b-thinking}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-15}
      AI_THINKING_BUDGET: ${AI_THINKING_BUDGET:-256}
    ports:
      # Personal API is loopback-only; it is not an Internet login service.
      - "127.0.0.1:9100:9100"
    volumes:
      - app_logs:/app/logs
      - api_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:9100/actuator/health',timeout=3))['status']=='UP'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - job-helper

  agent:
    image: ${JOB_HELPER_AGENT_IMAGE:-job-helper-agent:release}
    container_name: job-helper-agent
    restart: unless-stopped
    build:
      context: ./ai-job-agent
      dockerfile: Dockerfile
      labels:
        org.opencontainers.image.revision: ${JOB_HELPER_BUILD_SHA:-unreleased}
        io.job-helper.build-id: ${JOB_HELPER_BUILD_ID:-unreleased}
        io.job-helper.build-channel: ${JOB_HELPER_BUILD_CHANNEL:-unreleased}
        io.job-helper.managed: "true"
        io.job-helper.version: ${JOB_HELPER_VERSION:-unreleased}
    environment:
      TZ: Asia/Shanghai
      JOB_HELPER_BUILD_ID: ${JOB_HELPER_BUILD_ID:-unreleased}
      JOB_HELPER_VERSION: ${JOB_HELPER_VERSION:-unreleased}
      AGENT_PERSISTENCE_ENABLED: "true"
      AGENT_CHECKPOINT_PATH: /app/data/langgraph-checkpoints.sqlite3
      AGENT_DB_HOST: mysql
      AGENT_DB_PORT: "3306"
      AGENT_DB_USER: ai_job
      AGENT_DB_PASSWORD: ${MYSQL_PASSWORD}
      AGENT_DB_NAME: ai_job
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:-}
      AGENT_SUBJECT_REF: ${AGENT_SUBJECT_REF:-local-installation}
      LANGGRAPH_STRICT_MSGPACK: "true"
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:9101:9101"
    volumes:
      - agent_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; response = urllib.request.urlopen('http://127.0.0.1:9101/health/ready', timeout=3); payload = json.load(response); raise SystemExit(0 if response.status == 200 and payload.get('status') == 'ready' else 1)"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - job-helper

networks:
  job-helper:
    driver: bridge

volumes:
  mysql_data:
  app_logs:
  agent_data:
  api_data:
